<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, Inter, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="40" y="50" font-size="28" font-weight="700" fill="#111111">ProjectMarket — palette candidates</text>
  <text x="40" y="76" font-size="13" fill="#6B6B6B">Three directional options to compare in Figma. Same token names across all three.</text>

  <!-- Palette A: Warm Premium -->
  <g transform="translate(40, 120)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#888" letter-spacing="2">A · WARM PREMIUM</text>
    <text x="0" y="22" font-size="18" font-weight="600" fill="#111">Ivory · Champagne · Mocha · Soft Black</text>
    <text x="0" y="42" font-size="12" fill="#6B6B6B">Research-aligned. Calm, feminine, premium.</text>

    <!-- Swatches -->
    <g transform="translate(0, 60)">
      <rect width="170" height="100" fill="#F8F4EC" stroke="#E4DBC8"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">background</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#F8F4EC</text>
    </g>
    <g transform="translate(180, 60)">
      <rect width="170" height="100" fill="#EFE8DA"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">surface-muted</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#EFE8DA</text>
    </g>
    <g transform="translate(360, 60)">
      <rect width="170" height="100" fill="#C9A86A"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">accent (champagne)</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#C9A86A</text>
    </g>
    <g transform="translate(540, 60)">
      <rect width="170" height="100" fill="#6A5F50"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">foreground-muted (mocha)</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#6A5F50</text>
    </g>
    <g transform="translate(720, 60)">
      <rect width="170" height="100" fill="#1F1A14"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">foreground (soft black)</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#1F1A14</text>
    </g>
    <g transform="translate(900, 60)">
      <rect width="80" height="100" fill="#5E7A4E"/>
      <text x="10" y="116" font-size="10" font-weight="600" fill="#111">success</text>
      <text x="10" y="130" font-size="9" font-family="Menlo, monospace" fill="#6B6B6B">#5E7A4E</text>
    </g>
    <g transform="translate(990, 60)">
      <rect width="80" height="100" fill="#A8443A"/>
      <text x="10" y="116" font-size="10" font-weight="600" fill="#111">danger</text>
      <text x="10" y="130" font-size="9" font-family="Menlo, monospace" fill="#6B6B6B">#A8443A</text>
    </g>
  </g>

  <!-- Palette B: Cool Neutral -->
  <g transform="translate(40, 340)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#888" letter-spacing="2">B · COOL NEUTRAL</text>
    <text x="0" y="22" font-size="18" font-weight="600" fill="#111">Zinc / shadcn baseline</text>
    <text x="0" y="42" font-size="12" fill="#6B6B6B">Modern, neutral, tool-like. The current scaffold default.</text>

    <g transform="translate(0, 60)">
      <rect width="170" height="100" fill="#FFFFFF" stroke="#E4E4E7"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">background</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#FFFFFF</text>
    </g>
    <g transform="translate(180, 60)">
      <rect width="170" height="100" fill="#F4F4F5"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">surface-muted</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#F4F4F5</text>
    </g>
    <g transform="translate(360, 60)">
      <rect width="170" height="100" fill="#18181B"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">accent</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#18181B</text>
    </g>
    <g transform="translate(540, 60)">
      <rect width="170" height="100" fill="#71717A"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">foreground-muted</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#71717A</text>
    </g>
    <g transform="translate(720, 60)">
      <rect width="170" height="100" fill="#09090B"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">foreground</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#09090B</text>
    </g>
    <g transform="translate(900, 60)">
      <rect width="80" height="100" fill="#16A34A"/>
      <text x="10" y="116" font-size="10" font-weight="600" fill="#111">success</text>
      <text x="10" y="130" font-size="9" font-family="Menlo, monospace" fill="#6B6B6B">#16A34A</text>
    </g>
    <g transform="translate(990, 60)">
      <rect width="80" height="100" fill="#DC2626"/>
      <text x="10" y="116" font-size="10" font-weight="600" fill="#111">danger</text>
      <text x="10" y="130" font-size="9" font-family="Menlo, monospace" fill="#6B6B6B">#DC2626</text>
    </g>
  </g>

  <!-- Palette C: Soft Black Luxury -->
  <g transform="translate(40, 560)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#888" letter-spacing="2">C · SOFT BLACK LUXURY</text>
    <text x="0" y="22" font-size="18" font-weight="600" fill="#111">Dark variant of Palette A</text>
    <text x="0" y="42" font-size="12" fill="#6B6B6B">Editorial, dramatic. Natural dark-mode partner for the warm-premium direction.</text>

    <g transform="translate(0, 60)">
      <rect width="170" height="100" fill="#1A1614"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">background</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#1A1614</text>
    </g>
    <g transform="translate(180, 60)">
      <rect width="170" height="100" fill="#332B27"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">surface-muted</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#332B27</text>
    </g>
    <g transform="translate(360, 60)">
      <rect width="170" height="100" fill="#D9B677"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">accent (light champagne)</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#D9B677</text>
    </g>
    <g transform="translate(540, 60)">
      <rect width="170" height="100" fill="#A89D8A"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">foreground-muted</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#A89D8A</text>
    </g>
    <g transform="translate(720, 60)">
      <rect width="170" height="100" fill="#F4ECDD"/>
      <text x="12" y="116" font-size="11" font-weight="600" fill="#111">foreground (warm cream)</text>
      <text x="12" y="130" font-size="10" font-family="Menlo, monospace" fill="#6B6B6B">#F4ECDD</text>
    </g>
    <g transform="translate(900, 60)">
      <rect width="80" height="100" fill="#7FA070"/>
      <text x="10" y="116" font-size="10" font-weight="600" fill="#111">success</text>
      <text x="10" y="130" font-size="9" font-family="Menlo, monospace" fill="#6B6B6B">#7FA070</text>
    </g>
    <g transform="translate(990, 60)">
      <rect width="80" height="100" fill="#C77268"/>
      <text x="10" y="116" font-size="10" font-weight="600" fill="#111">danger</text>
      <text x="10" y="130" font-size="9" font-family="Menlo, monospace" fill="#6B6B6B">#C77268</text>
    </g>
  </g>
</svg>
